services:
  japanese-studying:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: japanese-studying
    ports:
      - "80:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/sbb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "true"
    volumes:
      - japanese-studying-data:/app/data
    restart: unless-stopped

volumes:
  japanese-studying-data:
