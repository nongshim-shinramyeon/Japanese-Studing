name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build application jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar
          cp build/libs/*.jar app.jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -H "15.164.41.1" >> ~/.ssh/known_hosts

      - name: Pull latest code on server
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "ubuntu@15.164.41.1" \
            "cd ~/Japanese-Studing && git pull origin main"

      - name: Upload jar to server
        run: |
          scp -i ~/.ssh/lightsail_key app.jar \
            "ubuntu@15.164.41.1:~/Japanese-Studing/app.jar"

      - name: Restart Docker container
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "ubuntu@15.164.41.1" \
            "cd ~/Japanese-Studing && docker-compose down && docker-compose up -d --build"
