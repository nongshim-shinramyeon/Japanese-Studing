spring.application.name=JLPTCloud
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jlptcloud}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jlptcloud}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jlptcloud}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.h2.console.enabled=false
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
jlptcloud.legacy-h2-migration.enabled=${JLPTCLOUD_LEGACY_H2_MIGRATION_ENABLED:false}
jlptcloud.legacy-h2-migration.url=${JLPTCLOUD_LEGACY_H2_URL:jdbc:h2:file:/legacy-h2-data/jlptcloud;MODE=MYSQL;IFEXISTS=TRUE;ACCESS_MODE_DATA=r}
