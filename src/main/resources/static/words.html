<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words | Japanese King</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-badge">JK</span>
            <span>Japanese King</span>
        </a>
        <nav class="nav">
            <a href="/">Home</a>
            <a class="active" href="/words.html">Words</a>
            <a href="/grammar-notes.html">Grammar Notes</a>
            <a href="/community.html">Community</a>
            <a href="/h2-console">H2 Console</a>
            <a href="/login.html" id="auth-link">Login</a>
        </nav>
    </header>

    <section class="panel word-browser">
        <div class="table-header compact">
            <div>
                <p class="eyebrow">JLPT Word Book</p>
                <h2>Level vocabulary</h2>
                <p class="muted">Browse JLPT words and manage your own study status.</p>
            </div>
            <div class="stack">
                <p class="table-note">Signed in as <strong id="current-user">-</strong></p>
                <p class="table-note">Total items: <strong id="word-count">0</strong></p>
            </div>
        </div>

        <div id="level-tabs" class="level-tabs" aria-label="JLPT level tabs">
            <button type="button" class="level-tab active" data-level="N5">N5</button>
            <button type="button" class="level-tab" data-level="N4">N4</button>
            <button type="button" class="level-tab" data-level="N3">N3</button>
            <button type="button" class="level-tab" data-level="N2">N2</button>
            <button type="button" class="level-tab" data-level="N1">N1</button>
        </div>

        <div id="word-message" class="message" hidden></div>

        <div class="table-wrap embedded">
            <table>
                <thead>
                <tr>
                    <th>Word</th>
                    <th>Reading</th>
                    <th>Meaning</th>
                    <th>Level</th>
                    <th>My status</th>
                </tr>
                </thead>
                <tbody id="word-table-body"></tbody>
            </table>
        </div>

        <div id="word-empty" class="empty" hidden>No words found for this level.</div>

        <div class="table-header compact bottom">
            <div class="pager">
                <button type="button" id="word-prev-page" class="secondary">Previous</button>
                <button type="button" id="word-next-page" class="secondary">Next</button>
            </div>
            <p class="table-note">Page: <strong id="word-page">1 / 1</strong></p>
        </div>
    </section>
</div>
<script type="module" src="/js/words.js"></script>
</body>
</html>
